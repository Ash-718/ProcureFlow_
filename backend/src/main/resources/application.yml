spring:
  application:
    name: innovate-gov-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5433/innovategov}
    username: ${DATABASE_USER:innovategov}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8001}
  error:
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-1234567890}
    expiry-ms: ${JWT_EXPIRY_MS:86400000}
  cors:
    # Comma-separated. Vite falls back to 5174/5175/... if 5173 is taken by another
    # local project, so a few likely ports are allowed out of the box for local dev.
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176}
  ai-service:
    url: ${AI_SERVICE_URL:http://127.0.0.1:8081}
  file-storage:
    path: ${FILE_STORAGE_PATH:../uploads}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Public and detailed on purpose for this demo build (shows real DB
      # connectivity, not a fake "ok") — tighten to "when-authorized" before
      # any real deployment.
      show-details: always

logging:
  level:
    com.innovategov: INFO
    org.springframework.security: INFO
