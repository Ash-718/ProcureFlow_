# INNOVATE-GOV — deployment stack.
#
#   React (built, served by Nginx)  ->  FastAPI  ->  PostgreSQL
#
# Run from the repo root:
#   docker compose -f docker/docker-compose.yml up --build
#
# Then open http://localhost:8080 and sign in with any account from the
# README's "Demo Accounts" section.
#
# Docker is for deployment only. Local development runs the three processes
# directly — see the README's "Local development" section — and needs no
# containers.
#
# CHANGED IN THE PYTHON MIGRATION:
#   - the `ai-service` container is gone; the AI pipeline now runs in-process
#     inside the backend (backend/app/ai/), so there is no second service to
#     start, no HTTP hop between them, and no AI_SERVICE_URL to configure
#   - `backend` is FastAPI on :8000, not Spring Boot on :8001
#   - the database URL is a SQLAlchemy URL, not JDBC, and carries its own
#     credentials rather than separate DATABASE_USER / DATABASE_PASSWORD vars
#
# NOTE ON PGVECTOR: the reference spec calls for a pgvector-enabled Postgres
# image. This project stores embeddings as plain `double precision[]` columns
# and computes cosine similarity with numpy (see docs/ai-matching.md for why),
# so a plain postgres image is enough — there is no extension to install.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: innovategov
      # Development-only credential for a throwaway container. Override with a
      # real secret before any deployment that is reachable from a network.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-innovategov_docker_pw}
      POSTGRES_DB: innovategov
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied by the postgres image on first boot only, in filename order.
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      # Host 5433 matches the local development port, so the same connection
      # string works whether Postgres is containerised or installed natively.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U innovategov -d innovategov"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    environment:
      # SQLAlchemy URL. `postgres` is the compose service name and 5432 is the
      # container-internal port — not the 5433 the host publishes.
      DATABASE_URL: postgresql+psycopg://innovategov:${POSTGRES_PASSWORD:-innovategov_docker_pw}@postgres:5432/innovategov
      # Must be overridden for any real deployment. The application derives its
      # HMAC algorithm from this value's length (see app/security/jwt.py).
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-before-any-real-deployment-1234567890}
      JWT_EXPIRY_MS: 86400000
      # The browser talks to Nginx on :8080, which proxies /api to this
      # service; this origin is what CORS must allow.
      CORS_ALLOWED_ORIGIN: http://localhost:8080
      FILE_STORAGE_PATH: /uploads
      # Local sentence-transformers model, baked into the image. No API key,
      # no outbound network call at runtime.
      EMBEDDING_PROVIDER: local
    volumes:
      - uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ../frontend
    depends_on:
      # Waits for the backend's healthcheck rather than merely for the
      # container to exist, so Nginx does not start proxying to a backend that
      # is still loading the embedding model.
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  pgdata:
  uploads:
