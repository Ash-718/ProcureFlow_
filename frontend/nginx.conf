server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend service (Docker network hostname "backend").
    location /api/ {
        proxy_pass http://backend:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React Router client-side routing: fall back to index.html for any
    # unmatched path instead of a raw Nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
