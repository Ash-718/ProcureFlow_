server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the FastAPI backend. `backend` is the Docker Compose
    # service name and 8000 is its container port — this was :8001 while the
    # backend was Spring Boot.
    #
    # The application calls the relative path `/api/v1/...`, so this is the
    # production counterpart of Vite's dev proxy (see frontend/vite.config.ts).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Document uploads are multipart and can exceed Nginx's 1 MB default,
        # which would surface as a 413 before the request ever reached FastAPI.
        client_max_body_size 25m;

        # A matching run embeds every startup on a cold model and can take
        # noticeably longer than the 60s default read timeout.
        proxy_read_timeout 180s;
    }

    # React Router client-side routing: fall back to index.html for any
    # unmatched path instead of a raw Nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
